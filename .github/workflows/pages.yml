name: Publicar sitio en GitHub Pages

# El sitio es HTML estático: se sube tal cual, sin Jekyll.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # El repositorio pesa ~372 MB y el despliegue se agotaba por tiempo.
      # Estas carpetas no las referencia ninguna pagina (RELIGIOSO/ es copia
      # de img/RELIGIOSO/, y scss/ son fuentes de Bootstrap, no se sirven),
      # asi que se quedan en el repositorio pero no se publican.
      - name: Preparar el sitio
        run: |
          mkdir -p _sitio
          # Las rutas van ancladas con "/" para no excluir img/RELIGIOSO/,
          # que si se usa en el catalogo y en la pagina religiosa.
          rsync -a ./ _sitio/ \
            --exclude '/.git' \
            --exclude '/.github' \
            --exclude '/_sitio' \
            --exclude '/RELIGIOSO/' \
            --exclude '/LOGO RODY OBRAS/' \
            --exclude '/ELEMENTOS/' \
            --exclude '/scss/'
          echo "Tamano publicado:"
          du -sh _sitio
          echo "Portadas religiosas incluidas:"
          find _sitio/img/RELIGIOSO -type f | wc -l

      - name: Empaquetar el sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
